name: Android APK CI

on:
  workflow_dispatch:
  push:
    branches:
      - AzaharPlus
    paths-ignore:
      - README.md
      - .github/**

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 5G

jobs:

  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/chromium
          docker system prune -af || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 替代舊 Action：直接調用系統內建的 sdkmanager 接受授權
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 同步將 NDK 版本修正為穩定的 "27"
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;27"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/CMakeLists.txt') }}

      - name: Enable CCache
        run: |
          echo "CC='ccache clang'" >> $GITHUB_ENV
          echo "CXX='ccache clang++'" >> $GITHUB_ENV

      - name: Build Debug APK
        working-directory: src/android
        run: |
          ./gradlew --stacktrace --no-daemon \
            :app:assembleVanillaDebug

      - name: List APK files (Debug)
        working-directory: src/android
        run: find app/build/outputs/apk -name "*.apk" -type f | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: src/android/app/build/outputs/apk/vanilla/debug/app-vanilla-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/chromium
          docker system prune -af || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 替代舊 Action：直接調用系統內建的 sdkmanager 接受授權
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 同步將 NDK 版本修正為穩定的 "27"
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;27"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/CMakeLists.txt') }}

      - name: Enable CCache
        run: |
          echo "CC='ccache clang'" >> $GITHUB_ENV
          echo "CXX='ccache clang++'" >> $GITHUB_ENV

      - name: Create debug.keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build Release APK
        working-directory: src/android
        run: |
          ./gradlew --stacktrace --no-daemon \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="androiddebugkey" \
            -Pandroid.injected.signing.key.password="android" \
            :app:assembleVanillaRelease

      - name: List APK files (Release)
        working-directory: src/android
        run: find app/build/outputs/apk -name "*.apk" -type f | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: src/android/app/build/outputs/apk/vanilla/release/app-vanilla-release.apk
          if-no-files-found: error
          retention-days: 30
